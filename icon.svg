<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="JOGU">
  <defs>
    <linearGradient id="jogu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="jogu-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22E5A0"/>
      <stop offset="100%" stop-color="#2E6BFF"/>
    </linearGradient>
    <linearGradient id="jogu-node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A3D"/>
      <stop offset="100%" stop-color="#FF5C7A"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="url(#jogu-bg)"/>

  <!-- Ingresso / cancello: parentesi aperta astratta -->
  <path d="M32 26 L32 74 M32 26 L47 26 M32 74 L47 74"
        fill="none" stroke="#F5F7FA" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Passaggio: linea di movimento dal cancello verso il nodo -->
  <line x1="40" y1="50" x2="76" y2="27" stroke="url(#jogu-accent)"
        stroke-width="7" stroke-linecap="round"/>

  <!-- Nodo: il giocatore che entra a completare la partita -->
  <circle cx="78" cy="24" r="9" fill="url(#jogu-node)"/>
</svg>
